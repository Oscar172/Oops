<!DOCTYPE html>
  <html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DLC Giveaway</title>
    <style>
      :root {
        --bg1: #0f172a;
        --bg2: #1e293b;
        --card: rgba(255, 255, 255, 0.08);
        --border: rgba(255, 255, 255, 0.18);
        --text: #f8fafc;
        --muted: #cbd5e1;
        --accent: #22c55e;
        --accent-hover: #16a34a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, #1d4ed8 0%, transparent 30%),
          radial-gradient(circle at top right, #7c3aed 0%, transparent 30%),
          linear-gradient(135deg, var(--bg1), var(--bg2));
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 16px;
      }

      .container {
        width: 100%;
        max-width: 1000px;
        text-align: center;
      }

      h1 {
        font-size: 2.4rem;
        margin-bottom: 12px;
      }

      p {
        color: var(--muted);
        margin-bottom: 32px;
      }

      .gif-box {
        margin: 0 auto 32px;
        max-width: 420px;
        border-radius: 18px;
        overflow: hidden;
        border: 1px solid var(--border);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      }

      .gif-box img {
        display: block;
        width: 100%;
        height: auto;
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 24px;
      }

      .card {
        background: var(--card);
        backdrop-filter: blur(12px);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 24px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      }

      .card h2 {
        margin-top: 0;
        margin-bottom: 12px;
        font-size: 1.4rem;
      }

      .code {
        background: rgba(255, 255, 255, 0.08);
        border: 1px dashed rgba(255, 255, 255, 0.25);
        border-radius: 14px;
        padding: 18px;
        margin: 16px 0;
        font-size: 1.2rem;
        letter-spacing: 2px;
        font-weight: bold;
        word-break: break-word;
      }

      button {
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 12px;
        padding: 12px 18px;
        font-size: 1rem;
        cursor: pointer;
        transition: background 0.2s ease, transform 0.2s ease;
      }

      button:hover {
        background: var(--accent-hover);
        transform: translateY(-2px);
      }

      .footer {
        margin-top: 28px;
        font-size: 0.95rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>VAD ÄR DETTA!??!?!??!?!!?</h1>
      <p>????????</p>

      <div class="gif-box">
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExdGxmNDlpZmJzdHRyemNua3BsMnloNmwzY3E2ZTFxNnhieW5vbWFyciZlcD12MV9naWZzX3RyZW5kaW5nJmN0PWc/ytu2GUYbvhz7zShGwS/giphy.gif" alt="Gaming GIF">
      </div>

      <div class="cards">
        <div class="card">
          <h2>Kod 1</h2>
          <div class="code" id="code1">44HV4-PV26T-VDNNG</div>
          <button onclick="copyCode('code1')">ILGGK-7X4Y9-AKQJR</button>
        </div>

        <div class="card">
          <h2>Kod 2</h2>
          <div class="code" id="code2">DIN-ANDRA-KOD-HAR</div>
          <button onclick="copyCode('code2')">Kopiera kod 2</button>
        </div>
      </div>

      <div class="footer">
        Älskar dig <33333
      </div>
    </div>

    <script>
      function copyCode(id) {
        const text = document.getElementById(id).innerText;
        navigator.clipboard.writeText(text).then(() => {
          alert("Koden kopierades: " + text);
        });
      }
    </script>
  </body>
  </html>
